# Builds a Linux AppImage of any branch by hand (Actions > AppImage > Run workflow) and
# attaches it to the run, to try a change on Linux or check that bundling still works
# before a release. Needs no secrets: without MEMEITY_GOOGLE_CLIENT_ID/SECRET the app asks
# for your own Google OAuth client, and it's built without updater artifacts.
name: AppImage

on:
  workflow_dispatch:

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build AppImage
        run: ./node_modules/.bin/tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: memeity-appimage-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
